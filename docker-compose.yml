services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: cadaster-postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: cadaster
      POSTGRES_USER: cadaster
      POSTGRES_PASSWORD: cadaster

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: